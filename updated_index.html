/* ── COUNTER ── */
function Counter({ target, suffix }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        let start = 0;
        const dur = 1200;
        const step = (ts) => {
          if (!start) start = ts;
          const p = Math.min((ts - start) / dur, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          setVal(Math.floor(ease * target));
          if (p < 1) requestAnimationFrame(step);else
          setVal(target);
        };
        requestAnimationFrame(step);
        obs.disconnect();
      }
    }, { threshold: 0.2 });
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, [target]);
  return <span ref={ref}>{val}{suffix}</span>;
}

function ContactPage() {
  const [sent, setSent] = useState(false);
  const [form, setForm] = useState({ name: '', email: '', msg: '' });

  return (
    <main className="page-enter" style={{ flex: 1, padding: '60px clamp(20px,5vw,60px) 80px' }}>

        <div>
          <p style={{ fontSize: 15, color: 'var(--ink2)', lineHeight: 1.7, marginBottom: 32 }}>
            Have an AI project? Want to collaborate or just say hi? I'm all ears.
          </p>
          {[
          ['Email', DATA.contact.email],
          ['Phone', DATA.contact.phone],
          ['GitHub', DATA.contact.github],
          ['LinkedIn', DATA.contact.linkedin]].
          map(([k, v]) =>
          <div key={k} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 0', borderBottom: '1px solid var(--border)' }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--ink3)', letterSpacing: '0.08em' }}>{k}</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--ink)' }}>{v}</span>
            </div>
          )}
        </div>
        {sent ?
        <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'flex-start', gap: 12 }}>
            <span style={{ width: 10, height: 10, borderRadius: '50%', background: 'var(--accent)' }} />
            <p style={{ fontSize: 22, fontWeight: 600 }}>Message sent.</p>
            <p style={{ fontSize: 14, color: 'var(--ink2)' }}>I'll get back to you within 24 hours.</p>
          </div> :

        <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            {[['name', 'Name', 'text'], ['email', 'Email', 'email']].map(([key, label, type]) =>
          <div key={key}>
                <label style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink3)', letterSpacing: '0.1em', display: 'block', marginBottom: 6 }}>{label.toUpperCase()}</label>
                <input type={type} required value={form[key]} onChange={(e) => handle(key, e.target.value)} style={{
              width: '100%', padding: '12px 14px', border: '1.5px solid var(--border)', borderRadius: 8,
              fontFamily: 'var(--font-display)', fontSize: 14, background: 'transparent', color: 'var(--ink)',
              outline: 'none', transition: 'border-color 0.2s'
            }}
            onFocus={(e) => e.target.style.borderColor = 'var(--ink)'}
            onBlur={(e) => e.target.style.borderColor = 'var(--border)'} />
            
              </div>
          )}
            <div>
              <label style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink3)', letterSpacing: '0.1em', display: 'block', marginBottom: 6 }}>MESSAGE</label>
              <textarea required rows={5} value={form.msg} onChange={(e) => handle('msg', e.target.value)} style={{
              width: '100%', padding: '12px 14px', border: '1.5px solid var(--border)', borderRadius: 8,
              fontFamily: 'var(--font-display)', fontSize: 14, background: 'transparent', color: 'var(--ink)',

            }}
            onFocus={(e) => e.target.style.borderColor = 'var(--ink)'}
            onBlur={(e) => e.target.style.borderColor = 'var(--border)'} />
            
            </div>
            <button type="submit" style={{
            background: 'var(--ink)', color: '#f7f6f2', padding: '13px 28px',
            border: 'none', borderRadius: 8, fontFamily: 'var(--font-display)', fontSize: 14, fontWeight: 600,
            cursor: 'pointer', alignSelf: 'flex-start'
          }}>Send Message →</button>
          </form>
        }
      </div>
    </main>);

}

      {/* Main footer grid */}
      <div style={{
        display: 'grid',
        gridTemplateColumns: 'minmax(200px,1.5fr) minmax(140px,1fr) minmax(200px,1.5fr)',
        gap: 'clamp(24px,4vw,60px)',
        padding: 'clamp(40px,5vw,64px) clamp(20px,5vw,60px)',
        borderBottom: '1px solid var(--border)',
      }}>
        {/* Brand */}
        <div>
          <h3 style={{ fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em', marginBottom: 12 }}>Sairam Maruri</h3>
          <p style={{ fontSize: 14, color: 'var(--ink2)', lineHeight: 1.7, maxWidth: 260, marginBottom: 20 }}>
            Product-minded GenAI engineer shipping agent workflows, retrieval systems, cloud deployments, and interfaces that feel intentional.
          </p>
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.1em', color: 'var(--ink3)', textTransform: 'uppercase' }}>
              GenAI & ML Engineer
            </span>
            <span style={{ color: 'var(--ink3)', fontSize: 11 }}>·</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.1em', color: 'var(--accent)', textTransform: 'uppercase', display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--accent)', display: 'inline-block', animation: 'pulse 2s ease infinite' }} />
              Available for Opportunities
            </span>
          </div>
        </div>

        {/* Explore */}
        <div>
          <p style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.16em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: 20 }}>Explore</p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {exploreLinks.map(([label, pg]) => (
              <button key={pg} onClick={() => { setPage(pg); window.scrollTo({ top: 0 }); }} style={{
                background: 'none', border: 'none', cursor: 'pointer', textAlign: 'left', padding: 0,
                fontFamily: 'var(--font-display)', fontSize: 15, color: 'var(--ink2)', transition: 'color 0.2s',
              }}
                onMouseEnter={e => e.currentTarget.style.color = 'var(--ink)'}
                onMouseLeave={e => e.currentTarget.style.color = 'var(--ink2)'}
              >{label}</button>
            ))}
          </div>
        </div>

        {/* Connect */}
        <div>
          <p style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.16em', color: 'var(--ink3)', textTransform: 'uppercase', marginBottom: 20 }}>Connect</p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {connectLinks.map(({ label, href, icon }) => (
              <a key={label} href={href} target="_blank" rel="noopener noreferrer" style={{
                display: 'flex', alignItems: 'center', gap: 10,
                fontFamily: 'var(--font-display)', fontSize: 14, color: 'var(--ink2)',
                textDecoration: 'none', transition: 'color 0.2s',
              }}
                onMouseEnter={e => e.currentTarget.style.color = 'var(--ink)'}
                onMouseLeave={e => e.currentTarget.style.color = 'var(--ink2)'}
              >
                <span style={{
                  width: 28, height: 28, borderRadius: 6, border: '1px solid var(--border)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  fontSize: 11, fontFamily: 'var(--font-mono)', flexShrink: 0, background: '#fff',
                }}>{icon}</span>
                {label}
              </a>
            ))}
          </div>
        </div>
      </div>

      {/* Bottom bar */}
      <div style={{
        padding: '20px clamp(20px,5vw,60px)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12,
      }}>
        <p style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink3)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
          © {year} Sai Rama Linga Reddy Maruri
        </p>
        <p style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink3)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
          Built for Shipping, Not Placeholders.
        </p>
      </div>
    </footer>
  );
}

/* ── TWEAKS PANEL ── */
function TweaksPanel({ tweaks, setTweaks, visible }) {
  const update = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    document.documentElement.style.setProperty('--accent', next.accentColor);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed', bottom: 24, right: 24, zIndex: 9999,
      background: '#fff', border: '1.5px solid var(--border)', borderRadius: 12,
      padding: 20, width: 240, boxShadow: '0 8px 32px rgba(0,0,0,0.1)',
      fontFamily: 'var(--font-display)', fontSize: 13
    }}>
      <p style={{ fontWeight: 600, marginBottom: 16, fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.1em' }}>TWEAKS</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <label>
          <span style={{ fontSize: 12, color: 'var(--ink3)', display: 'block', marginBottom: 6 }}>Accent Color</span>
          <div style={{ display: 'flex', gap: 8 }}>
            {['oklch(0.72 0.21 142)', 'oklch(0.72 0.21 260)', 'oklch(0.72 0.21 30)', 'oklch(0.72 0.21 330)'].map((c, i) =>
            <button key={i} onClick={() => update('accentColor', c)} style={{
              width: 24, height: 24, borderRadius: '50%', background: c,
              border: tweaks.accentColor === c ? '2px solid var(--ink)' : '2px solid transparent', cursor: 'pointer'
            }} />
            )}
          </div>
        </label>
        <label style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontSize: 12, color: 'var(--ink3)' }}>Status Dot</span>
          <input type="checkbox" checked={tweaks.showDot} onChange={(e) => update('showDot', e.target.checked)} />
        </label>
        <label>
          <span style={{ fontSize: 12, color: 'var(--ink3)', display: 'block', marginBottom: 6 }}>Resume URL</span>
          <input
            type="text" value={tweaks.resumeLink} placeholder="https://..."
            onChange={(e) => update('resumeLink', e.target.value)}
            style={{ width: '100%', padding: '6px 10px', border: '1px solid var(--border)', borderRadius: 6, fontSize: 12, fontFamily: 'var(--font-mono)', outline: 'none' }} />
          
        </label>
      </div>
    </div>);

}

/* ── APP ── */
function App() {
  const [page, setPage] = useState(() => localStorage.getItem('msrlr_page') || 'home');
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweakVisible, setTweakVisible] = useState(false);

  useEffect(() => {localStorage.setItem('msrlr_page', page);window.scrollTo({ top: 0, behavior: 'smooth' });}, [page]);
  useEffect(() => {document.documentElement.style.setProperty('--accent', tweaks.accentColor);}, [tweaks.accentColor]);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const pages = { home: <HomePage setPage={setPage} />, work: <WorkPage />, about: <AboutPage />, skills: <SkillsPage />, services: <ServicesPage />, blog: <BlogPage />, contact: <ContactPage />, certifications: <CertificationsPage />, privacy: <PrivacyPage />, terms: <TermsPage /> };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Header page={page} setPage={setPage} tweaks={tweaks} />
      <div key={page} style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
        {pages[page] || <HomePage setPage={setPage} />}
      </div>
      <Footer setPage={setPage} />
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweakVisible} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
